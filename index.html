<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1408">
<title>גולני: שומר העץ</title>
<style>
:root{--gold:#f2c35b;--gold2:#ffe3a1;--ink:#17110a;--panel:rgba(23,17,10,.82);--line:rgba(242,195,91,.35);--red:#e5483a;--green:#5fd06a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0a05;color:#fff;font-family:"Segoe UI","Noto Sans Hebrew","Heebo",Arial,sans-serif;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0}
#camvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#ui .hidden,.hidden{display:none!important}
#touch{position:absolute;inset:0;pointer-events:auto;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;direction:ltr}
.btn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(20,16,8,.45);color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700;font-size:11px;touch-action:none;backdrop-filter:blur(3px)}
.btn svg{width:46%;height:46%;fill:#fff}
.btn.down{background:rgba(242,195,91,.55);transform:scale(.94)}
#btnFire{right:max(26px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));width:104px;height:104px;background:rgba(229,72,58,.45);border-color:rgba(255,160,150,.8)}
#btnReload{right:150px;bottom:34px;width:58px;height:58px}
#btnGren{right:34px;bottom:146px;width:58px;height:58px}
#btnSwitch{right:118px;bottom:112px;width:58px;height:58px}
#btnAct{right:210px;bottom:100px;width:70px;height:70px;background:rgba(95,208,106,.5);border-color:#bff5c4;animation:pulse 1s infinite}
#btnSettings{right:12px;top:10px;width:40px;height:40px;position:absolute}
@keyframes pulse{50%{transform:scale(1.08)}}
#joyBase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);display:none;pointer-events:none}
#joyBase.on{display:block}
#joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.7);transform:translate(-50%,-50%)}
#joyHint{position:absolute;left:28px;bottom:36px;width:96px;height:96px;border-radius:50%;border:2px dashed rgba(255,255,255,.22);pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:rgba(255,255,255,.9);box-shadow:0 0 2px #000}
#cross:before{left:12px;top:0;width:2px;height:26px;clip-path:polygon(0 0,100% 0,100% 38%,0 38%,0 62%,100% 62%,100% 100%,0 100%)}
#cross:after{top:12px;left:0;height:2px;width:26px;clip-path:polygon(0 0,38% 0,38% 100%,0 100%,62% 0,100% 0,100% 100%,62% 100%)}
#hitmark{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;opacity:0;pointer-events:none;transition:opacity .25s}
#hitmark.show{opacity:1;transition:none}
#hitmark:before,#hitmark:after{content:"";position:absolute;left:16px;top:-2px;width:3px;height:38px;background:#fff;transform:rotate(45deg)}
#hitmark:after{transform:rotate(-45deg)}
#hitmark.head:before,#hitmark.head:after{background:var(--red)}
#vig{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(200,20,10,.75) 100%);transition:opacity .4s}
#vig.on{opacity:1;transition:none}
#top{position:absolute;left:12px;right:60px;top:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:14px;font-weight:700;text-shadow:0 1px 3px #000}
#top .col{display:flex;flex-direction:column;gap:3px;min-width:90px}
#treeWrap{width:min(280px,34vw);text-align:center}
.bar{height:12px;border-radius:8px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.4);overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(#7be07f,#3da447);transition:width .15s}
#treeBar i.low{background:linear-gradient(#f08a6a,#c23a24)}
#pBar{position:absolute;left:14px;bottom:10px;width:120px}
#pBar i{background:linear-gradient(#ff8a7a,#d8392a)}
#ammo{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);text-align:center;font-weight:800;text-shadow:0 1px 3px #000;pointer-events:none}
#ammo .w{font-size:12px;color:var(--gold2);letter-spacing:.5px}
#ammo .n{font-size:26px;line-height:1}
#ammo .n small{font-size:14px;opacity:.8}
#ammo .g{font-size:12px;opacity:.9}
#crateArrow{position:absolute;left:50%;top:52px;width:130px;margin-left:-65px;text-align:center;font-size:12px;font-weight:700;pointer-events:none;text-shadow:0 1px 3px #000}
#crateArrow .ar{display:inline-block;font-size:26px;color:var(--green);transition:transform .1s}
#banner{position:absolute;left:0;right:0;top:24%;text-align:center;font-size:clamp(34px,8vw,64px);font-weight:900;color:var(--gold2);text-shadow:0 3px 12px #000,0 0 30px rgba(242,195,91,.6);opacity:0;pointer-events:none;letter-spacing:2px}
#banner.show{animation:ban 2.6s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(1.5)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#toast{position:absolute;left:50%;top:78px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:6px 14px;border-radius:18px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:70vw;text-align:center}
#toast.show{opacity:1}
#story{position:absolute;left:8vw;right:8vw;bottom:30%;text-align:center;padding:8px 16px;background:rgba(0,0,0,.35);border-radius:12px;font-size:clamp(15px,3vw,22px);line-height:1.5;font-weight:600;text-shadow:0 2px 8px #000;pointer-events:none;opacity:0;transition:opacity .8s}
#story.show{opacity:1}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:radial-gradient(ellipse at 50% 40%,rgba(20,14,6,.55),rgba(8,5,2,.88));z-index:20;padding:10px}
.card{max-width:520px;width:92%;max-height:96%;overflow:auto;text-align:center;padding:16px 20px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.card h1{margin:0 0 4px;font-size:clamp(24px,5.4vw,38px);color:var(--gold2);text-shadow:0 2px 12px rgba(242,195,91,.5)}
.card p{margin:2px 0 12px;opacity:.9;font-size:14px}
.card h2{margin:0 0 8px;color:var(--gold2);font-size:20px}
.cta{display:block;width:100%;margin:8px 0;padding:12px;border-radius:12px;border:1px solid var(--gold);background:linear-gradient(#f5cd6e,#c8923a);color:#2a1a05;font-size:17px;font-weight:800;font-family:inherit}
.cta.sec{background:rgba(255,255,255,.08);color:#fff;border-color:var(--line);font-weight:600;font-size:15px}
.cta:active{transform:scale(.98)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-size:14px}
.row select,.row input[type=range]{font-family:inherit;font-size:14px;background:#2b2113;color:#fff;border:1px solid var(--line);border-radius:8px;padding:5px;max-width:55%}
.row input[type=range]{padding:0;width:50%}
.tiny{font-size:12px;opacity:.7}
#shop{position:absolute;top:104px;bottom:8px;width:min(340px,44vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;pointer-events:auto;overflow:auto;z-index:15;right:10px}
#shop h3{margin:0 0 4px;color:var(--gold2);font-size:16px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;margin:5px 0;background:rgba(255,255,255,.07);border-radius:10px;font-size:13px}
.item b{color:var(--gold2)}
.item button{font-family:inherit;border:0;border-radius:8px;padding:7px 10px;background:var(--gold);color:#2a1a05;font-weight:800;font-size:13px;min-width:78px}
.item button:disabled{background:#555;color:#aaa}
#count{font-size:28px;font-weight:900;color:var(--gold2);text-align:center}
#rotate{position:absolute;inset:0;z-index:50;background:#0d0a05;display:none;align-items:center;justify-content:center;flex-direction:column;font-size:20px;text-align:center;pointer-events:auto;padding:20px}
#rotate svg{width:80px;height:80px;fill:var(--gold);margin-bottom:12px;animation:rot 2s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
#rotate.on{display:flex}
#rotate button{margin-top:16px;padding:10px 22px;border-radius:12px;border:1px solid var(--gold);background:rgba(255,255,255,.08);color:#fff;font-size:15px;font-family:inherit}
#arMsg{position:absolute;left:0;right:0;bottom:22%;text-align:center;font-size:18px;font-weight:700;text-shadow:0 2px 8px #000;pointer-events:none;padding:0 10vw}
@media (max-height:380px){#btnFire{width:88px;height:88px}#btnReload{right:130px;bottom:30px;width:50px;height:50px}#btnGren{right:30px;bottom:124px;width:50px;height:50px}#btnSwitch{right:104px;bottom:96px;width:50px;height:50px}#btnAct{right:190px;bottom:84px}}
</style>
</head>
<body>
<div id="app">
  <video id="camvid" playsinline muted autoplay></video>
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="touch"></div>
    <div id="joyBase"><div id="joyKnob"></div></div>
    <div id="hud" class="hidden">
      <div id="joyHint"></div>
      <div id="vig"></div>
      <div id="cross"></div><div id="hitmark"></div>
      <div id="top">
        <div class="col"><div id="waveTxt">-</div><div id="zTxt">-</div></div>
        <div id="treeWrap"><div id="treeLbl" data-t="tree">העץ</div><div class="bar" id="treeBar"><i></i></div></div>
        <div class="col" style="align-items:flex-end"><div id="ptsTxt">0</div><div class="tiny" id="scoreTxt"></div></div>
      </div>
      <div id="crateArrow" class="hidden"><div class="ar" id="arArrow">▲</div><div id="crateName" data-t="crate"></div><div id="crateDist"></div></div>
      <div class="bar" id="pBar"><i></i></div>
      <div id="ammo"><div class="w" id="wName"></div><div class="n"><span id="mag">0</span> <small>/ <span id="res">0</span></small></div><div class="g" id="gCount"></div></div>
      <button class="btn" id="btnFire"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M11 1h2v5h-2zM11 18h2v5h-2zM1 11h5v2H1zM18 11h5v2h-5z"/></svg></button>
      <button class="btn" id="btnReload"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
      <button class="btn" id="btnGren"><svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="7"/><path d="M10 3h5v3h-5z"/></svg></button>
      <button class="btn" id="btnSwitch"><svg viewBox="0 0 24 24"><path d="M7 7h10V4l5 5-5 5v-3H7zM17 17H7v3l-5-5 5-5v3h10z"/></svg></button>
      <button class="btn hidden" id="btnAct"><span data-t="refill">תחמושת</span></button>
      <button class="btn hidden" id="btnShopT" style="right:12px;top:58px;width:40px;height:40px;position:absolute"><svg viewBox="0 0 24 24"><path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM1 2v2h2l3.6 7.6-1.4 2.4A2 2 0 0 0 7 17h12v-2H7.4l1.1-2h7.5a2 2 0 0 0 1.7-1l3.6-6.5A1 1 0 0 0 20.4 4H5.2l-.9-2zM17 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg></button>
      <button class="btn" id="btnSettings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7 7 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7 7 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></button>
    </div>
    <div id="banner"></div><div id="toast"></div><div id="story"></div><div id="arMsg" class="hidden"></div>

    <div id="shop" class="hidden">
      <h3 data-t="prepTitle">הכנה</h3>
      <div id="count">30</div>
      <div id="shopItems"></div>
      <button class="cta" id="btnStart" data-t="startWave">התחל גל</button>
    </div>

    <div id="menu" class="screen">
      <div class="card">
        <h1 data-t="title">גולני: שומר העץ</h1>
        <p data-t="subtitle"></p>
        <button class="cta" id="btnPlay" data-t="play">שחק</button>
        <button class="cta sec" id="btnPlayAR" data-t="playAR">AR</button>
        <button class="cta sec" id="btnMenuSettings" data-t="settings">הגדרות</button>
        <div class="tiny"><span data-t="hiscore">שיא</span>: <b id="hiTxt">0</b></div>
      </div>
    </div>

    <div id="settings" class="screen hidden">
      <div class="card">
        <h2 data-t="settings">הגדרות</h2>
        <div class="row"><span data-t="language">שפה</span><select id="setLang"><option value="he">עברית</option><option value="en">English</option></select></div>
        <div class="row"><span data-t="quality">איכות</span><select id="setQual"><option value="auto" data-t="qAuto">auto</option><option value="high" data-t="qHigh">high</option><option value="med" data-t="qMed">med</option><option value="low" data-t="qLow">low</option></select></div>
        <div class="row"><span data-t="gyro">ג׳יירו</span><input type="checkbox" id="setGyro" checked></div>
        <div class="row"><span data-t="sens">רגישות</span><input type="range" id="setSens" min="0.4" max="2.2" step="0.05" value="1"></div>
        <div class="row"><span data-t="volume">עוצמה</span><input type="range" id="setVol" min="0" max="1" step="0.05" value="0.8"></div>
        <button class="cta" id="btnSetClose" data-t="close">סגור</button>
      </div>
    </div>

    <div id="end" class="screen hidden">
      <div class="card">
        <h1 id="endTitle"></h1>
        <p id="endLine"></p>
        <p><span data-t="score">ניקוד</span>: <b id="endScore">0</b> &nbsp; <span data-t="hiscore">שיא</span>: <b id="endHi">0</b></p>
        <button class="cta" id="btnAgain" data-t="again">שוב</button>
        <button class="cta sec" id="btnToMenu" data-t="toMenu">תפריט</button>
      </div>
    </div>
  </div>
  <div id="rotate"><svg viewBox="0 0 24 24"><path d="M16.5 2h-9A2.5 2.5 0 0 0 5 4.5v15A2.5 2.5 0 0 0 7.5 22h9a2.5 2.5 0 0 0 2.5-2.5v-15A2.5 2.5 0 0 0 16.5 2zM12 21a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm5-4H7V5h10z"/></svg><div data-t="rotate">סובב</div><button id="btnRotOk" data-t="continueAnyway">המשך בכל זאת</button></div>
</div>
